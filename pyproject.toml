[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weather-hedging-demo"
version = "0.1.0"
description = "Synthetic temperature indices and a chronological hedge-tracking demonstration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy==2.4.4", "matplotlib==3.10.9"]

[project.scripts]
weather-hedging-demo = "weather_hedging_demo.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
